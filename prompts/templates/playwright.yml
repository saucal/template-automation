# Template for .github/workflows/playwright.yml — copy into the project and adapt.
#
# MANUAL ONLY ([ci-manual-dispatch]): `workflow_dispatch` is the single trigger.
# These suites drive REAL sites — they place orders, register accounts and hit
# payment sandboxes — so nothing starts one but a person. Never `on: push`, and
# never on every PR: the stock `npx playwright init` workflow is a landmine
# here, delete it rather than adapting it.
#
# The record/compare cycle is two dispatches:
#
#   after a content sync   →  RECORD: the @visual slice with update_snapshots=true
#                             (staging content was just replaced from production,
#                             so every prior baseline is stale by definition).
#   after a deploy         →  COMPARE: the suite with the flag off, so the
#                             screenshot diff is purely the code change.
#
# Baselines travel between the two through the Actions cache (see the test job).
#
# EVERY project-specific knob is marked `ADAPT:` — `grep -n 'ADAPT:' ` this file
# after copying and work through the list. Paths follow the reference
# architecture: package.json, the lockfile, .nvmrc and playwright.config.ts at
# the REPO ROOT, the suite itself (specs, reports, test-results) under e2e/.
name: Playwright Tests
run-name: "E2E: ${{ inputs.suite }} on ${{ inputs.environment }}${{ inputs.grep && format(' ({0})', inputs.grep) }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which site to test (one Playwright project per environment)'
        type: choice
        # ADAPT: environments — mirror the config's ENVIRONMENTS array exactly
        # ([env-as-project]). One tier? List the one, and drop `both` here and
        # in the matrix below. Do not invent a second tier to fill this in.
        default: staging
        options: [ staging, preprod, both ]
      suite:
        description: 'Which specs to run'
        type: choice
        # ADAPT: suites — one entry per folder under e2e/specs/, plus `all`.
        default: all
        options: [ all, orders, checkout, account, visual ]
      grep:
        description: 'Optional tag/title filter, e.g. @plugin:woocommerce or "place order"'
        type: string
        default: ''
      update_snapshots:
        description: 'Re-record visual baselines (cached for the next compare run)'
        type: boolean
        default: false

concurrency:
  group: playwright-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # This job exists for one reason: `container.image` and `matrix` are resolved
  # before any step runs, so they can only interpolate values from ANOTHER job.
  # It reads the Playwright version out of the lockfile so the container tag
  # follows whatever the repo installs. (Do NOT use `:latest`: `npm ci` installs
  # the LOCKED version, so the newest image would pair a 1.62 browser build with
  # a 1.61 test package and every job would die on a missing executable.)
  setup:
    runs-on: ubuntu-latest
    outputs:
      playwright: ${{ steps.pw.outputs.version }}
      projects: ${{ steps.plan.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - id: pw
        run: |
          v=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Playwright $v"
      - id: plan
        # `both` fans out to one runner per site so a red staging cannot hide a
        # green preprod. ADAPT: same environment list as the input above; a
        # single-tier project keeps only the else line.
        run: |
          if [ '${{ inputs.environment }}' = both ]; then
            echo 'projects=["staging","preprod"]' >> "$GITHUB_OUTPUT"
          else
            echo 'projects=["${{ inputs.environment }}"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: ${{ matrix.project }} / ${{ inputs.suite }}${{ inputs.update_snapshots && ' (record)' || '' }}
    needs: [ setup ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Official Playwright image: browsers + OS deps prebaked, so no browser
    # download and no apt step per run.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.setup.outputs.playwright }}-noble
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.setup.outputs.projects) }}
    env:
      # ADAPT: env — repo Variables (non-sensitive) + Secrets (sensitive) → the
      # env the suite reads via process.env. One BASE_URL_<ENV> per Playwright
      # project ([env-as-project]). dotenv.config() does NOT override real env
      # vars, so these always win; no .env file is needed on the runner.
      BASE_URL_PREPROD: ${{ vars.BASE_URL_PREPROD }}
      BASE_URL_STAGING: ${{ vars.BASE_URL_STAGING }}
      WP_ADMIN_USER:    ${{ vars.WP_ADMIN_USER }}
      MAILPIT_URL:      ${{ vars.MAILPIT_URL }}        # optional, safe if unset
      ADMIN_PASS:       ${{ secrets.ADMIN_PASS }}
      PASSWORD:         ${{ secrets.PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      # Baselines live in the Actions cache, never in git
      # ([visual-baselines-not-committed]). The key is unique per run so a record
      # run always writes a NEW entry; restore-keys picks the most recent one,
      # i.e. the last record dispatch.
      - name: Restore visual baselines
        id: baselines
        uses: actions/cache/restore@v4
        with:
          path: e2e/specs/visual-baselines/
          key: pw-snaps-${{ matrix.project }}-${{ github.run_id }}
          restore-keys: pw-snaps-${{ matrix.project }}-

      # Node version from .nvmrc, so CI and laptops run the same major.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ADAPT: nothing — but the install MUST carry a token ([private-packages]):
      # this repo's own GITHUB_TOKEN does not reach a package linked to another
      # repo. The expression takes the PACKAGES_TOKEN secret when it exists.
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run Playwright tests
        env:
          SUITE:  ${{ inputs.suite }}
          UPDATE: ${{ inputs.update_snapshots }}
          GREP:   ${{ inputs.grep }}
          # Empty when nothing was restored — Actions caches are evicted after 7
          # days unused, so a long gap between record and compare lands here.
          MATCHED: ${{ steps.baselines.outputs.cache-matched-key }}
        run: |
          args=( --project="${{ matrix.project }}" )
          # `visual` is a TAG, not a folder: the slice may be a standalone
          # specs/visual.spec.ts or woven into the functional specs, and @visual
          # is what `npm run baseline` greps for either way (see visual-spec).
          tag=''
          if [ "$SUITE" = visual ]; then tag='@visual'
          elif [ "$SUITE" != all ]; then args+=( "e2e/specs/$SUITE" )
          fi
          # ONE --grep: Playwright keeps only the last one it is given, so a
          # dispatch that filters the visual slice has to combine the two.
          if [ -n "$tag" ] && [ -n "$GREP" ]; then args+=( --grep "(?=.*$tag)(?=.*$GREP)" )
          elif [ -n "$tag" ];  then args+=( --grep "$tag" )
          elif [ -n "$GREP" ]; then args+=( --grep "$GREP" )
          fi
          if [ "$UPDATE" = true ]; then
            args+=( --update-snapshots )
          elif [ -z "$MATCHED" ]; then
            # Comparing with no baseline would just rewrite it and fail every
            # visual test — a confusing red that says nothing about the deploy.
            if [ "$SUITE" = visual ]; then
              # Nothing left to run; say why instead of Playwright's "No tests found".
              echo "::error::No cached visual baselines for ${{ matrix.project }}. Dispatch this workflow with update_snapshots=true first."
              exit 1
            fi
            echo "::warning::No cached visual baselines for ${{ matrix.project }} — skipping the visual slice."
            args+=( --grep-invert "@visual" )
          fi
          echo "npx playwright test ${args[*]}"
          npx playwright test "${args[@]}"

      # Only a record run writes baselines back. Saved even on failure so a
      # partially-recorded set still beats none; the next record overwrites it.
      - name: Save visual baselines
        if: ${{ inputs.update_snapshots && !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: e2e/specs/visual-baselines/
          key: pw-snaps-${{ matrix.project }}-${{ github.run_id }}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.project }}-${{ inputs.suite }}
          path: e2e/reports/
          retention-days: 30

      # Traces + videos are recorded on every test but kept only for failures
      # (the fixture discards them on pass), so this is small and only exists
      # when something actually broke.
      - name: Upload traces & videos (failures only)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.project }}-${{ inputs.suite }}
          path: e2e/test-results/
          retention-days: 14

      # Also surfaced as an artifact on record runs, so a baseline change can be
      # eyeballed without digging into the cache.
      - name: Upload recorded baselines
        if: ${{ inputs.update_snapshots && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.project }}
          path: e2e/specs/visual-baselines/
          retention-days: 30
